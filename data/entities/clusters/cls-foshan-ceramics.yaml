  - fact: "8,000+ registered ceramics entities, ~2,000 brands; 152 high-tech firms; listed firms include Dongpeng, Keda, Monalisa, Arrow."
    source: src-taocixinxi-20240902
  - fact: "Origin 1983: Shiwan Lihua imported Italy's glazed-tile line (start of modern Chinese building ceramics); 2002 China Ceramics City opened."
    source: src-nfnews-20220601
  - fact: "Ceramic machinery: ~80% of China's ceramic presses and 85% of polished-tile presses made in Foshan (Lital, Keda)."
