  - fact: "Cluster centered on Guzhen, radiating 3 cities/11 towns, with annual output value exceeding RMB 100B."
    source: src-oeeee-20251023, src-stcn
  - fact: "30,000+ lighting business entities in the town (some sources 45,000+ registered); 200,000+ industry workers."
    source: src-xinhua-20241122, src-stcn
  - fact: "Originated 1982 with the first self-made lamp copied from a Hong Kong sample; 2002 named 'China Lighting Capital'."
    source: src-zsdag, src-stcn
  - fact: "China's overall lighting industry reached RMB 600B annual sales; 2024 export US$56.1B; 2025 Jan-Aug export US$34.4B (-6.7% YoY)."
    source: src-oeeee-20251023
  - fact: "Guzhen Lighting Fair (since 1999) is the Asia-Pacific's largest lighting exhibition; 33rd edition drew ~160,000 visitors, 4,800+ overseas buyers from 144 countries."
