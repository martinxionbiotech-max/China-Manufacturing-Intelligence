  - fact: "2024: Shenzhen industrial output above designated size reached RMB 5.4 trillion; total industrial added value RMB 1.24 trillion; #1 nationally in both for 3 consecutive years."
    source: src-sz-gov-2024-annual
  - fact: "2024: computer/communication/electronic-equipment manufacturing added value grew 11.0% YoY."
    source: src-sz-gov-2024-annual
  - fact: "More than 4,100 electronics manufacturers above designated size; 5 enterprises >RMB 100B; 27 >RMB 10B; ~400 >RMB 500M; 21 in China's top-100 electronics list."
    source: src-people-sz-20220407
  - fact: "Network communication + smart terminal segments ~RMB 1 trillion; UHD display + semiconductor/IC segments >RMB 100 billion."
    source: src-people-sz-20220407
  - fact: "~1 in 7 smartphones globally is 'made in Shenzhen'; Shenzhen produces ~1/2 of global communication base stations."
    source: src-c114-20240123
  - fact: "Huaqiangbei (Futian District) named 'China's No.1 Electronics Street' in 2008; world's largest electronics trading hub."
    source: src-stcn-20230727
