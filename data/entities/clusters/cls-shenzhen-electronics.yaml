    source: src-sz-customs-2024
  - fact: "2024: electromechanical product exports RMB 2 trillion (+12.1%), 71% of total; traditional electronics (phones/PCs/home appliances) RMB 377.43B (+6.8%); 'new three' (lithium batteries/EV/PV) RMB 99.69B (+11.5%); drones RMB 14.57B (+19.6%, national #1)."
    source: src-sz-customs-2024
  - fact: "2024: Shenzhen port container throughput exceeded 30M TEU (+13.7%); Yantian port alone >15.03M TEU."
